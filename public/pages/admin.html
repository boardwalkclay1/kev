<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Kevin’s Tree Service</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="admin-body">

<header class="admin-header">
  <div class="admin-header-inner">
    <h1>Kevin’s Admin Dashboard</h1>
    <p>Contracts • Estimates • Invoices • Proposals</p>

    <div class="weather-time">
      <span id="atlClock"></span> • <span id="atlWeather"></span>
    </div>
  </div>
</header>

<main class="admin-container">

  <!-- LEFT SIDEBAR -->
  <aside class="admin-sidebar">
    <h3>Document Type</h3>

    <select id="docType" onchange="switchDocType()">
      <option value="contract">Contract</option>
      <option value="estimate">Estimate</option>
      <option value="invoice">Invoice</option>
      <option value="proposal">Proposal</option>
    </select>

    <h3>Instructions</h3>
    <div id="instructionsBox" class="instructions-box">
      Select a document type to view instructions.
    </div>

    <h3>Client Info</h3>
    <div class="field">
      <label>Client Name</label>
      <input id="clientName" type="text">
    </div>
    <div class="field">
      <label>Client Email</label>
      <input id="clientEmail" type="email">
    </div>
    <div class="field">
      <label>Job Address</label>
      <input id="clientAddress" type="text">
    </div>

    <button class="bubble-btn primary" onclick="emailDocument()">Email Document</button>
  </aside>

  <!-- MAIN DOCUMENT PANEL -->
  <section class="admin-doc-panel">

    <h2 id="docTitle">Contract</h2>

    <textarea id="docBody" class="doc-body"></textarea>

    <h3>Client Signature</h3>
    <canvas id="signaturePad" width="600" height="200"></canvas>

    <div class="sig-actions">
      <button class="bubble-btn secondary" onclick="clearSignature()">Clear</button>
      <button class="bubble-btn primary" onclick="downloadSignature()">Download Signature</button>
    </div>

  </section>

</main>

<footer class="footer">
  <p>Admin • Kevin’s Tree Service LLC</p>
</footer>

<script src="/js/app.js"></script>
</body>
</html>
